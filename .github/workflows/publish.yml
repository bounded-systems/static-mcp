name: publish

# Publish @bounded-systems/static-mcp to JSR and npm using KEYLESS OIDC.
#
# Dual mirror: the package ships to BOTH registries (the user owns the
# @bounded-systems npm org). Node MCP servers (site-mcp) consume it from npm; Deno
# from JSR. Its JSR-only deps (@bounded-systems/verbspec, @bounded-systems/verify)
# reach Node via JSR's npm bridge (see .npmrc).
#
# No tokens are stored in this repo:
#   - JSR: `deno publish` mints a short-lived GitHub Actions OIDC token JSR trusts
#     (link the repo once at jsr.io/@bounded-systems/static-mcp → Settings).
#   - npm: trusted publishing exchanges the OIDC token for publish auth and
#     attaches build provenance (link the repo + workflow once on npmjs.com).
#
# Triggered only by a `v*` tag (or manual dispatch). Never publishes on push.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # REQUIRED: lets both jobs mint the OIDC token the registries trust

jobs:
  jsr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Publish to JSR (keyless OIDC)
        run: deno publish

  npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # npm trusted publishing needs npm >= 11.5.
      - name: Ensure npm >= 11.5
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Publish to npm (trusted publishing + provenance)
        run: npm publish --provenance --access public
